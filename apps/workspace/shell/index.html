    <!-- D#37 WS-D criterion 2: mode, system/mode and branding are always
         200, anonymous, static JSON (WS-C criterion 2) -- these three
         preloads are unconditional, discovered by the HTML parser's own
         preload scanner before any script (module or classic) even
         starts. auth/me is NOT a static tag here: it 401s for a
         signed-out visitor, and a preloaded request that 401s logs a
         console error regardless of what JS does with the response --
         core/preload-auth.js (right below) adds that fourth preload only
         when the fx_has_session hint says a session is plausible, the
         same guard core/boot.js's own checkCloudSession() uses. -->
    <link rel="preload" href="/api/mode" as="fetch" crossorigin>
    <link rel="preload" href="/api/system/mode" as="fetch" crossorigin>
    <link rel="preload" href="/api/branding" as="fetch" crossorigin>

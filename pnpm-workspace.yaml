packages:
  - "apps/*"
  - "packages/*"
  # Private package: it is not in the public tree, so the public lockfile must not
  # carry an importer for it (a missing importer directory fails --frozen-lockfile).
  # It installs and tests on its own, with its own lockfile.
  - "!packages/doc-templates"
# packages/runner (the only workspace with `workflow` as a direct dependency)
# otherwise resolves vitest@2.1.9 against supports-color@7.2.0 while every
# other workspace resolves supports-color@10.2.2, producing two physical
# vitest installs and breaking @fx/db's `declare module 'vitest'`
# augmentation under runner's tsc (TS2664/TS2345). pnpm 11 ignores root
# package.json's `pnpm.overrides`, so this has to live here.
overrides:
  supports-color: "10.2.2"
  # GHSA-4cwx-7wf7-3272 (high) + moderate advisories: @workflow/world-local and
  # @workflow/world-vercel pin undici 7.28.0 exactly; fixed in >=7.29.1.
  undici: "7.30.0"
# esbuild's postinstall build script needs an explicit allow, or a plain
# `pnpm install` hits ERR_PNPM_IGNORED_BUILDS (vitest's transform
# dependency). Each package used to carry its own pnpm-workspace.yaml
# stopgap for this before there was a root workspace (H02/K01) -- folded
# into the one root file here, now that there is one.
allowBuilds:
  # D#2 H09b2-wf: transitive deps of the new `workflow` dependency
  # (packages/runner). Neither native build is needed for this PR's usage
  # (`sleep`/`createHook`/the bare "use workflow"/"use step" directives,
  # which are inert string literals with no bundler transform wired into
  # this repo) -- confirmed directly: `import { sleep } from "workflow"`
  # and calling it work correctly with these builds left unrun. Set to
  # `false` rather than silently left unresolved, so `pnpm install`
  # doesn't warn/fail on an unresolved ERR_PNPM_IGNORED_BUILDS entry.
  # `@swc/core` is `@workflow/cli`/`@workflow/rollup`'s bundler transform
  # (only exercised by `workflow build`/`validate`, not run by this repo);
  # `cbor-extract` backs `workflow`'s local dev-runtime storage. Revisit
  # (set to `true`) whenever a future task actually runs the `workflow`
  # CLI's build/transform tooling or its local web/CLI dev runtime.
  '@swc/core': false
  cbor-extract: false
  esbuild: true

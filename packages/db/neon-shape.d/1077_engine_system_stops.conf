# neon-shape entry for packages/db/migrations/1077_engine_system_stops.sql. Data only (see packages/db/scripts/neon-shape-entries.sh for the grammar).
# engine_stop_definer is new: it owns five SECURITY DEFINER functions, two predicates (engine_plan_ended, engine_repo_operated; EXECUTE: machine_jobs_owner, for the deliver check) and three system-stop functions
# (engine_system_stops_due, engine_system_stop_issue, engine_system_stop_next_due; EXECUTE: platform_ops). It reads column-wise nine tables' non-sealed facts, inserts machine_jobs rows only under a policy that admits a system stop,
# updates machine_jobs.state only of an issued start (to superseded), and inserts one audit action. machine_job_deliver is replaced in place (same owner, same grants), so it is on no new list.
# 1077 reads 1068's machine_jobs.stop_reason (1068 re-carries audit_write), so it is held back with the audit_write migrations.

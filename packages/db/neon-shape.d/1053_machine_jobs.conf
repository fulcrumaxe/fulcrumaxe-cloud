# neon-shape entry for packages/db/migrations/1053_machine_jobs.sql. Data only (see packages/db/scripts/neon-shape-entries.sh for the grammar).
# machine_jobs_owner is new, and it is not machine_ops (which can read sealed credential columns). It owns six functions: four SECURITY DEFINER ones with EXECUTE for app_user alone (the cloud's issuer, the runner's
# pending read, the one-time pickup and the progress fence and write) and two invoker helpers that nobody but the owner can call. Its privileges are what they use: the machine_jobs table, UPDATE on six columns of
# project_setups with the SELECT of three, SELECT on three columns of runners, and the two columns of accounts that account_is_active reads (for the session's own account only).
role machine_jobs_owner
functions MACHINE_JOBS_OWNER machine_job_runner machine_job_expire machine_job_issue machine_job_pending machine_job_deliver setup_progress_record
functions MACHINE_JOBS_APP machine_job_issue machine_job_pending machine_job_deliver setup_progress_record
exempt machine_jobs_app check_invoker_exception_shape machine_jobs_owner app_user @FUNCTIONS:MACHINE_JOBS_APP
privilege MACHINE_JOBS_OWNER schema public USAGE
privilege MACHINE_JOBS_OWNER column accounts.id SELECT
privilege MACHINE_JOBS_OWNER column accounts.deleted_at SELECT
privilege MACHINE_JOBS_OWNER table machine_jobs SELECT
privilege MACHINE_JOBS_OWNER table machine_jobs INSERT
privilege MACHINE_JOBS_OWNER table machine_jobs UPDATE
privilege MACHINE_JOBS_OWNER column project_setups.id SELECT
privilege MACHINE_JOBS_OWNER column project_setups.account_id SELECT
privilege MACHINE_JOBS_OWNER column project_setups.repo_id SELECT
privilege MACHINE_JOBS_OWNER column project_setups.state UPDATE
privilege MACHINE_JOBS_OWNER column project_setups.sub_step UPDATE
privilege MACHINE_JOBS_OWNER column project_setups.failure_code UPDATE
privilege MACHINE_JOBS_OWNER column project_setups.failure_reason UPDATE
privilege MACHINE_JOBS_OWNER column project_setups.failure_at UPDATE
privilege MACHINE_JOBS_OWNER column project_setups.updated_at UPDATE
privilege MACHINE_JOBS_OWNER column runners.id SELECT
privilege MACHINE_JOBS_OWNER column runners.account_id SELECT
privilege MACHINE_JOBS_OWNER column runners.revoked_at SELECT
check check_sandbox_net_role_shape machine_jobs_owner MACHINE_JOBS_OWNER

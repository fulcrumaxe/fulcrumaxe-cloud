# neon-shape entry for packages/db/migrations/1066_session_job_contract.sql. Data only (see packages/db/scripts/neon-shape-entries.sh for the grammar).
# Two functions are new and owned by machine_jobs_owner (1053): machine_job_progress_record (SECURITY DEFINER, the report of a session job; EXECUTE for app_user alone) and engine_operate_off_supersede (SECURITY DEFINER, the
# AFTER trigger that supersedes the account's issued starts when operate goes off; EXECUTE for app_user alone, and called outside a trigger it only raises). A third, engine_operate_epoch_set (the BEFORE trigger that owns
# engine_bridge_settings.operate_epoch), is SECURITY INVOKER and stays owned by the migration role, so it is on no list here. machine_job_expire is replaced in place (same owner, same grants).
# machine_jobs_owner gains no privilege: it already holds table-wide SELECT, INSERT and UPDATE on machine_jobs, which cover the five new columns. The owner list below replaces 1057's with the two added.
functions MACHINE_JOBS_OWNER machine_job_runner machine_job_expire machine_job_issue machine_job_pending machine_job_deliver setup_progress_record machine_job_lapse machine_job_progress_record engine_operate_off_supersede
functions MACHINE_JOBS_SESSION machine_job_progress_record engine_operate_off_supersede
exempt machine_jobs_session check_invoker_exception_shape machine_jobs_owner app_user @FUNCTIONS:MACHINE_JOBS_SESSION

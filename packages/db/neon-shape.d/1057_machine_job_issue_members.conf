# neon-shape entry for packages/db/migrations/1057_machine_job_issue_members.sql. Data only (see packages/db/scripts/neon-shape-entries.sh for the grammar).
# machine_job_issue (owned by machine_jobs_owner since 1053) now checks that the session's person is an owner or admin of the account, so its owner gains a read of three columns of account_members
# (the account, the person and the role), through a policy that shows only the session's own account. The function and its EXECUTE grants are unchanged (CREATE OR REPLACE keeps both).
# machine_job_lapse is new: a SECURITY DEFINER function of the same owner with EXECUTE for app_user alone, with the same person check; the lists below replace 1053's with it added.
functions MACHINE_JOBS_OWNER machine_job_runner machine_job_expire machine_job_issue machine_job_pending machine_job_deliver setup_progress_record machine_job_lapse
functions MACHINE_JOBS_LAPSE machine_job_lapse
exempt machine_jobs_lapse check_invoker_exception_shape machine_jobs_owner app_user @FUNCTIONS:MACHINE_JOBS_LAPSE
privilege MACHINE_JOBS_OWNER column account_members.account_id SELECT
privilege MACHINE_JOBS_OWNER column account_members.user_id SELECT
privilege MACHINE_JOBS_OWNER column account_members.role SELECT

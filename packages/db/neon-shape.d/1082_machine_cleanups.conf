# neon-shape entry for packages/db/migrations/1082_machine_cleanups.sql. Data only (see packages/db/scripts/neon-shape-entries.sh for the grammar).
# Four functions are new and owned by machine_jobs_owner (1053), each SECURITY DEFINER with EXECUTE for app_user alone: machine_cleanup_due and machine_cleanup_issue (a runner session only,
# through machine_job_runner) and machine_cleanup_request and machine_cleanup_supersede_starts (a person who is an owner or admin, never a runner). The owner list below replaces 1071's with the four added.
# machine_jobs_owner gains what they read and write, in the session's account only: the new machine_cleanups table (SELECT, INSERT, UPDATE), the machine_cleanup_states view (an invoker-rights
# view over it, machine_jobs and runners), three columns of repos (the id, the account and the GitHub id the job is signed with) and two of engine_bridge_settings (the account and the operate epoch).

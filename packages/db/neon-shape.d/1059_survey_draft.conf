# neon-shape entry for packages/db/migrations/1059_survey_draft.sql. Data only (see packages/db/scripts/neon-shape-entries.sh for the grammar).
# project_drafts_owner is new, and it is not machine_ops or onboarding_ops. It owns five functions: three SECURITY DEFINER ones (survey_start_record, EXECUTE: app_user; survey_draft_record and survey_fail, EXECUTE: agent_run_writer) and two
# invoker helpers (project_draft_insert, project_setup_notice) that no login role can call. Its privileges are what they read and write: the account, the member and run columns the checks read, the survey columns of project_setups,
# the draft insert, and the one setup.changed notice (engine_bridge_definer's shape, for a different type).
role project_drafts_owner
functions PROJECT_DRAFTS_OWNER project_draft_insert project_setup_notice survey_start_record survey_draft_record survey_fail
functions PROJECT_DRAFTS_APP survey_start_record
functions PROJECT_DRAFTS_WRITER survey_draft_record survey_fail
exempt project_drafts_app check_invoker_exception_shape project_drafts_owner app_user @FUNCTIONS:PROJECT_DRAFTS_APP
exempt project_drafts_writer check_invoker_exception_shape project_drafts_owner agent_run_writer @FUNCTIONS:PROJECT_DRAFTS_WRITER
privilege PROJECT_DRAFTS_OWNER schema public USAGE

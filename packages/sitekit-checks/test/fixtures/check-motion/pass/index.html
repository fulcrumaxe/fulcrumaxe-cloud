<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Motion</title><style>
@keyframes spin{to{transform:rotate(1turn)}}
.spin{animation:spin 1s linear infinite;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main><h1>Spinner</h1><div class="spin">wait</div></main></body></html>

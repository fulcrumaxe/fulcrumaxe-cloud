name: vmhelper real root

# Runs the real pinned Firecracker jailer and Firecracker as root, through fx-vmhelper's launcher, on a hosted runner (D#587 B-2a-1b;
# the owner opted in to this one step on 2026-11-16). One job, started by hand (Actions tab, or `gh workflow run vmhelper-real-root.yml`)
# and on a pull request that changes packages/fx-runner/vmhelper or this file; nothing else triggers it.
#
# The test (internal/sandbox/real_jailer_test.go) runs inside a transient systemd service that carries the helper's pinned capability
# set, device policy, system call filter and cgroup delegation, all read from hardening.json, so a pass also shows the pinned set is
# enough (no CAP_SYS_CHROOT, FOWNER or KILL). It starts two sandboxes, each booting the pinned guest kernel and a small fixture root disk
# under Firecracker (configured through its API socket), and pings the guest over vsock as the runner's uid. It also checks the dropped uid and gid and the empty
# supplementary group list, the cgroup limits, that destroy leaves no process, cgroup or jail directory, and that reaping does not
# follow a planted symlink. sudo is used on the throwaway hosted VM only; there are no secrets, a read-only token and no inputs.
# Every download is checked against the sha256 in infra/microvm-image/lock.json. To undo, delete this file.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/fx-runner/vmhelper/**
      - .github/workflows/vmhelper-real-root.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FX_FORBID_MODEL_CALLS: "1"
  # A runner Go older than go.mod fails here; it never fetches a toolchain that nothing pins.
  GOTOOLCHAIN: local
  # fx-vmhelper is built without cgo: dropping a capability from every thread (AllThreadsSyscall) is refused with it.
  CGO_ENABLED: "0"

jobs:
  real-root:
    name: jailer and Firecracker under the pinned service
    if: vars.CI_DISABLED != 'true' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: What this host offers
        run: |
          go version
          uname -r
          stat -c '%A %U:%G %t:%T %n' /dev/kvm /dev/net/tun /dev/userfaultfd || true
          grep -E 'userfaultfd|tun|kvm' /proc/misc || true
          stat -fc %T /sys/fs/cgroup
      - name: Pinned Firecracker and jailer, and the test binary, in a root-owned directory
        run: |
          W="$RUNNER_TEMP/fc"
          mkdir -p "$W"
          bash infra/microvm-image/fetch-pin.sh .firecracker.amd64 "$W/firecracker.tgz"
          tar -xzf "$W/firecracker.tgz" -C "$W"
          (cd packages/fx-runner/vmhelper && go test -c -o "$W/sandbox.test" ./internal/sandbox && go build -o "$W/guestinit" ./internal/sandbox/testdata/guestinit)
          # The pinned guest kernel (checked against lock.json) and a small root disk whose init answers the agent's ping on vsock
          # port 5252 (the signed image is not a pinned download: the image workflow builds and boots that one).
          bash infra/microvm-image/fetch-pin.sh .kernel.amd64 "$W/vmlinux"
          R="$W/rootdir"
          mkdir -p "$R/usr/lib/fx" "$R/dev"
          install -m 0755 "$W/guestinit" "$R/usr/lib/fx/init"
          sudo mknod -m 0666 "$R/dev/null" c 1 3
          sudo mknod -m 0600 "$R/dev/console" c 5 1
          sudo mke2fs -q -t ext4 -L fxroot -E root_owner=0:0 -d "$R" "$W/rootfs.ext4" 16M
          D=/usr/libexec/fx-vmhelper-test
          namei -l /usr/libexec || true
          sudo install -d -m 0755 -o root -g root "$D"
          sudo install -m 0755 -o root -g root "$W"/release-v*-x86_64/jailer-v*-x86_64 "$D/jailer"
          sudo install -m 0755 -o root -g root "$W"/release-v*-x86_64/firecracker-v*-x86_64 "$D/firecracker"
          sudo install -m 0755 -o root -g root "$W/sandbox.test" "$D/sandbox.test"
          sudo install -m 0644 -o root -g root "$W/vmlinux" "$D/vmlinux"
          sudo install -m 0644 -o root -g root "$W/rootfs.ext4" "$D/rootfs.ext4"
          sudo install -d -m 0711 -o root -g root /var/lib/fx-vmhelper-test
          namei -l "$D/jailer"
      - name: Run the real jailer test inside a service with the pinned properties
        run: |
          H=packages/fx-runner/vmhelper/internal/hardening/hardening.json
          props=()
          while IFS= read -r line; do props+=(-p "$line"); done < <(jq -r '.directives | to_entries[] | .key as $k | (.value | if type == "array" then .[] else . end) | "\($k)=\(.)"' "$H")
          props+=(-p "CapabilityBoundingSet=$(jq -r '[.capabilities[].name] | join(" ")' "$H")")
          props+=(-p "ReadWritePaths=$(jq -r '.read_write_paths | join(" ")' "$H") /var/lib/fx-vmhelper-test")
          printf '%s\n' "${props[@]}" | grep -v '^-p$'
          sudo systemd-run --collect --wait --pipe --quiet "${props[@]}" \
            -E FX_VMHELPER_REAL_ROOT=1 -E FX_VM_JAILER=/usr/libexec/fx-vmhelper-test/jailer -E FX_VM_FIRECRACKER=/usr/libexec/fx-vmhelper-test/firecracker \
            -E FX_VM_JAIL_ROOT=/var/lib/fx-vmhelper-test -E FX_VM_KERNEL=/usr/libexec/fx-vmhelper-test/vmlinux -E FX_VM_ROOTFS=/usr/libexec/fx-vmhelper-test/rootfs.ext4 \
            /usr/libexec/fx-vmhelper-test/sandbox.test -test.run '^TestRealJailer$' -test.v
      - name: Kernel messages (seccomp kills, out of memory)
        if: failure()
        run: sudo dmesg | tail -n 60 || true

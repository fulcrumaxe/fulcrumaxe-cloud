name: WSL2 proof

# Does the runner's WSL2 gate hold on a real WSL2 machine? (D#587 B-9c.) A Ubuntu distribution is installed on a free GitHub-hosted
# windows-2022 runner, set up as the runner's README says (interop off, no Windows PATH, the C: drive automounted), restarted so the
# settings take effect, and then packages/fx-runner/scripts/wsl2-proof.sh runs inside it as an ordinary user: the kernel must name itself
# WSL2, the runner's own gate runs for real (each probe has an unsandboxed control), and the read-deny canary matrix runs under
# bubblewrap against a scripted loopback model API. Start it by hand (Actions tab, or `gh workflow run wsl2-proof.yml`).
#
# No secrets, no inputs, a read-only token and a dummy key: the hosted runner never holds a Claude credential. The job also requires a
# public repository. Hosted WSL2 has a flaky history, so a red run may be the host and not the runner: the summary says which step failed.
# To undo, delete this file and packages/fx-runner/scripts/wsl2-proof.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wsl2:
    if: vars.CI_DISABLED != 'true' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      WSL_UTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a WSL2 distribution and write its settings
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: false
          set-as-default: true
          wsl-conf: |
            [interop]
            enabled=false
            appendWindowsPath=false
          additional-packages: bubblewrap socat git curl ca-certificates xz-utils
      - name: Make the ordinary user the proof runs as
        shell: wsl-bash -u root {0}
        run: |
          useradd --create-home --shell /bin/bash fxproof
      - name: Record and normalise /etc/wsl.conf
        shell: wsl-bash -u root {0}
        run: |
          # Show the exact bytes the action wrote (a CRLF or BOM would make WSL ignore a key), then write the README's settings again as
          # plain LF text so the restart below reads them for certain.
          echo "--- /etc/wsl.conf as written by the action"; od -c /etc/wsl.conf
          # Exactly the file packages/fx-runner/README.md documents. (The setup action cannot carry the quoted [boot] command: its shell
          # escaping breaks the quotes, so the action writes the interop part and this step writes the whole file.)
          cat > /etc/wsl.conf <<'CONF'
          [boot]
          command = "sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/WSLInterop'"

          [interop]
          enabled=false
          appendWindowsPath=false
          CONF
          echo "--- /etc/wsl.conf now"; od -c /etc/wsl.conf
      - name: Restart WSL so the settings take effect, and record what Windows says
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path proof-out | Out-Null
          wsl --shutdown
          # Wait until Windows no longer lists the distribution as running; the next wsl call starts it again with the new settings.
          $stopped = $false
          for ($i = 0; $i -lt 60; $i++) {
            $running = (wsl -l --running 2>&1 | Out-String)
            if ($running -notmatch 'Ubuntu') { $stopped = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $stopped) { Write-Host "::error::job setup: the distribution still runs 60 s after wsl --shutdown, so /etc/wsl.conf was not re-read"; exit 1 }
          Start-Sleep -Seconds 2
          @('wsl --status', 'wsl -l -v', 'wsl --version') | ForEach-Object {
            "## $_" | Add-Content proof-out/windows.txt
            Invoke-Expression $_ 2>&1 | Add-Content proof-out/windows.txt
          }
          Get-Content proof-out/windows.txt
      - name: Check the settings reached the distribution
        shell: wsl-bash -u root {0}
        run: |
          # A red gate row can mean the machine was not set up as the README says (this job's fault) or that the README's settings are not
          # enough (the product's). Show the file and the registered binfmt entries, and stop here when the file itself is wrong, so the
          # two cases are told apart before the proof runs.
          echo "--- /etc/wsl.conf"; cat /etc/wsl.conf
          echo "--- binfmt_misc"; ls -la /proc/sys/fs/binfmt_misc/ || true
          for entry in /proc/sys/fs/binfmt_misc/WSLInterop*; do [ -e "$entry" ] && { echo "--- $entry"; cat "$entry"; }; done || true
          echo "--- pid 1"; ps -o pid=,comm= -p 1 || true
          echo "--- did the virtual machine restart? uptime and boot time"; cat /proc/uptime; ps -o lstart= -p 1 || true; date
          echo "--- kernel log mentions of interop"; dmesg 2>/dev/null | grep -i -E 'interop|binfmt' | head -20 || true
          # Job setup versus product gate: if the virtual machine did not restart (it has been up for minutes), a surviving WSLInterop entry
          # is this job's fault. If it did restart with the file shown above, the entry is the README settings' result and the product's
          # gate row decides; the job does not hide it here.
          up="$(cut -d. -f1 /proc/uptime)"
          if [ -e /proc/sys/fs/binfmt_misc/WSLInterop ] && [ "$up" -gt 120 ]; then
            echo "JOB SETUP ERROR (not a runner gate result): the WSLInterop entry exists and the virtual machine has been up ${up} s, so it was not restarted after /etc/wsl.conf was written" >&2
            exit 1
          fi
          if [ -e /proc/sys/fs/binfmt_misc/WSLInterop ]; then
            echo "NOTE: the machine restarted ${up} s ago with the README's settings and the WSLInterop entry is still registered; the runner's gate row reports on this, not the job setup"
          fi
          for key in enabled appendWindowsPath; do
            awk -v key="$key" '/^\[/ { section = tolower($0) } section == "[interop]" && tolower($0) ~ ("^[ \t]*" tolower(key) "[ \t]*=[ \t]*false") { ok = 1 } END { exit !ok }' /etc/wsl.conf \
              || { echo "the job did not write [interop] $key=false to /etc/wsl.conf: this is the job's setup, not the runner's gate" >&2; exit 1; }
          done
      - name: Copy the checkout onto the distribution's own file system
        shell: wsl-bash -u fxproof {0}
        run: |
          set -euo pipefail
          src="$(pwd)"
          case "$src" in /mnt/*) ;; *) echo "the working directory is not under /mnt: $src" >&2; exit 1 ;; esac
          # The checkout belongs to the Windows runner account, so git calls it dubious for this user. A file:// clone starts a second
          # process (upload-pack) and git scrubs GIT_CONFIG_COUNT and GIT_CONFIG_PARAMETERS from it, so neither the environment nor
          # `git -c` reaches it. The -u option names the command that runs there, so the trust is given on that command line. Only this
          # exact checkout is trusted (git names the .git directory in its refusal, so both spellings are listed) and no git config
          # file is written.
          git clone -u "git -c safe.directory=$src/.git -c safe.directory=$src upload-pack" --quiet --depth 1 "file://$src" "$HOME/fx-src"
      - name: Run the proof
        shell: wsl-bash -u fxproof {0}
        run: |
          cd "$HOME/fx-src"
          bash packages/fx-runner/scripts/wsl2-proof.sh "$HOME/proof-out"
      - name: Bring the results back to the runner
        if: always()
        shell: wsl-bash -u fxproof {0}
        run: |
          # The proof writes under HOME; this copy is best effort, so a failed write to the runner's drive is logged and never fails the step.
          if [ -d "$HOME/proof-out" ]; then
            if mkdir -p "$(pwd)/proof-out/wsl" && cp -r "$HOME/proof-out/." "$(pwd)/proof-out/wsl/"; then echo "results copied back"; else echo "copy-back to the runner workspace failed; the proof itself ran under HOME" >&2; fi
          else
            echo "no proof-out under HOME: the proof did not start"
          fi
          exit 0
      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path proof-out/wsl/summary.md) { Get-Content proof-out/wsl/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY }
          else { "## WSL2 proof: NOT TESTED`n`nThe proof script did not start inside the distribution. See the step logs." | Add-Content $env:GITHUB_STEP_SUMMARY }
      - name: Upload the logs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl2-proof
          path: proof-out
          if-no-files-found: warn

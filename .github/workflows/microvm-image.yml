name: microVM image
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  image:
    name: probe
    if: vars.CI_DISABLED != 'true' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
      - run: corepack enable && pnpm install --frozen-lockfile --filter "@fulcrumaxe/fx-runner..."
      - name: probe
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          W=$RUNNER_TEMP/p; mkdir -p $W/plan
          (cd packages/fx-runner/vmhelper && go build -o $W/fx-vmhelper ./cmd/fx-vmhelper)
          cat > "$W/plan/entry.ts" <<'EOT'
          import { writeFileSync } from "node:fs";
          import { buildInstallPlan } from "@REPO@/packages/fx-runner/src/vm/installPlan.ts";
          const plan = buildInstallPlan({ cpus: 4, memTotalKb: 16000000, smallestTemplateRamMb: 512, runner: { user: "runner", uid: 1001, gid: 1001 }, takenUids: [], takenGids: [] });
          writeFileSync(`${process.env.PLAN_DIR}/config.json`, plan.config.text);
          writeFileSync(`${process.env.PLAN_DIR}/fx-vmhelper.service`, plan.unit.text);
          EOT
          sed -i "s|@REPO@|$GITHUB_WORKSPACE|" "$W/plan/entry.ts"
          pnpm --filter @fulcrumaxe/fx-runner exec esbuild "$W/plan/entry.ts" --bundle --platform=node --format=esm --outfile="$W/plan/entry.mjs"
          PLAN_DIR="$W/plan" node "$W/plan/entry.mjs"
          sudo groupadd --system fx-vmhelper
          sudo install -d -m 0711 /var/lib/fx-vm
          sudo install -d -m 0700 /var/lib/fx-vm-snapshots
          sudo install -d -m 0755 /opt/fx-vmhelper/bin /etc/fx-vmhelper
          sudo install -m 0755 $W/fx-vmhelper /opt/fx-vmhelper/bin/fx-vmhelper
          sudo install -m 0600 $W/plan/config.json /etc/fx-vmhelper/config.json
          try() {
            echo "=== $1"
            T0=$(date +"%Y-%m-%d %H:%M:%S")
            sudo cp "$W/plan/fx-vmhelper.service" /etc/systemd/system/fx-vmhelper.service
            [ -z "$2" ] || sudo sed -i "$2" /etc/systemd/system/fx-vmhelper.service
            sudo systemctl daemon-reload
            sudo systemctl reset-failed fx-vmhelper.service 2>/dev/null || true
            sudo systemctl start fx-vmhelper.service || true
            sleep 2
            (sudo journalctl -u fx-vmhelper --no-pager --since "$T0" | grep -a "fx-vmhelper\[" | cut -d: -f4- | sort | uniq -c | head -4 || true); sudo systemctl show fx-vmhelper -p ExecMainStatus -p Result
            sudo systemctl stop fx-vmhelper.service 2>/dev/null || true
          }
          try full ""
          try no-group '/^Group=/d'
          try no-dirs '/^\(RuntimeDirectory\|StateDirectory\)/d'
          try no-dac-bounding 's/CAP_DAC_OVERRIDE //'
          try no-seccomp "/^SystemCallFilter/d"
          try no-nnp "/^NoNewPrivileges/d"
          try no-user "/^User=/d"

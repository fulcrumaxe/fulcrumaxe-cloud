name: microVM image

# Builds the fx-agent microVM root disk for amd64 and arm64 from infra/microvm-image, builds it a second time to show the bytes are
# the same, and then BOOTS the amd64 disk under the pinned Firecracker on this hosted runner: the answer to "does Firecracker run
# on a free hosted x64 Linux runner with KVM" (D#587 B-1, acceptance 9). The arm64 disk is built, not booted (a hosted x64 runner
# cannot). Started by hand only (Actions tab, or `gh workflow run microvm-image.yml`); it never runs on a pull request or a push.
# It also builds, installs and starts fx-vmhelper (the owner opted in to this change on 2026-11-20) so the helper-backed real-VM tests run.
# A step after the vitest run fails the job if any helper-backed real suite ran no test (the owner opted in to that change too).
# On 2026-11-21 the owner opted in to two more additions, both here: bubblewrap and socat are installed (apt) so the OS-sandbox side of
# the vmJob.real engine comparison runs instead of skipping, and a root-owned search script is installed that the vmJob.real test calls
# through `sudo -n`, to look for the job token in the helper's jail and snapshot directories as root (the token goes to it on standard input).
# A helper-backed suite is NOT found by name: a new one must be added by hand to `suites` in the guard step below, or it can skip unseen.
# The build steps are the local action .github/actions/microvm-image, which microvm-image-release.yml shares.
#
# No secrets, no inputs, a read-only token, and the job runs only on the public plane, so the private plane never queues it.
# Nothing is cached or published: the disks live on the runner and are gone when it is. Every download is checked against the
# sha256 in infra/microvm-image/lock.json, and the only actions are GitHub's own and this repository's. To undo, delete this file.
on:
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail, so a failing command in front of `| tee` fails the step
defaults:
  run:
    shell: bash

env:
  FX_FORBID_MODEL_CALLS: "1"
  # The large disk of a hosted runner: two root disks, two tars and the image layers do not fit beside the checkout.
  W: /mnt/fxvm

jobs:
  image:
    name: root disks and the Firecracker probe
    if: vars.CI_DISABLED != 'true' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile --filter "@fulcrumaxe/fx-runner..."
      # The OS-sandbox side of the vmJob.real engine comparison needs bubblewrap and socat on PATH. The probe is information only: the line it
      # writes to host.txt tells a skipped comparison (a restriction on unprivileged user namespaces) from a missing tool.
      - name: Install bubblewrap and socat (for the engine comparison)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$W"
          {
            echo "bubblewrap: $(bwrap --version) socat: $(socat -V | sed -n 2p)"
            echo "apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>&1)"
            echo "bwrap probe: $(bwrap --unshare-user --unshare-pid --ro-bind / / true 2>&1 && echo ok)"
          } 2>&1 | tee -a "$W/host.txt"
      - name: Build the root disks, twice, and compare
        uses: ./.github/actions/microvm-image
      - name: Pinned kernel and Firecracker (x86_64)
        run: |
          cd "$W"
          bash "$GITHUB_WORKSPACE/infra/microvm-image/fetch-pin.sh" .kernel.amd64 vmlinux
          bash "$GITHUB_WORKSPACE/infra/microvm-image/fetch-pin.sh" .firecracker.amd64 firecracker.tgz
          tar -xzf firecracker.tgz
          {
            echo "FX_VM_FIRECRACKER=$(echo "$W"/release-v*-x86_64/firecracker-v*-x86_64)"
            echo "FX_VM_KERNEL=$W/vmlinux"
            echo "FX_VM_ROOTFS=$W/a/amd64/rootfs.ext4"
          } >> "$GITHUB_ENV"
      - name: Make /dev/kvm usable by this user, and record what the host offers
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          { ls -l /dev/kvm; lscpu | grep -E 'Model name|Virtualization|Hypervisor vendor'; echo "load: $(cat /proc/loadavg)"; } 2>&1 | tee -a "$W/host.txt"
      # The helper-backed real-VM tests (microvmSandbox.real, workspaceCrossing.real) need the root helper, as production runs it. The
      # steps below build it with the runner's Go (no toolchain is fetched: GOTOOLCHAIN=local), install it the way `fx-runner vm install`
      # lays a machine out (the unit and the config come from the same `buildInstallPlan` the installer uses, so nothing is restated
      # here), start it under systemd, and run the tests as this non-root user, with the helper's group for its socket directory.
      - name: Build fx-vmhelper (no cgo, the runner's Go)
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          go version
          cd packages/fx-runner/vmhelper
          go build -o "$W/fx-vmhelper" ./cmd/fx-vmhelper
      - name: Render the helper's unit and config from the install plan
        run: |
          mkdir -p "$W/plan"
          cat > "$W/plan/entry.ts" <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          import { cpus } from "node:os";
          import { buildInstallPlan } from "@REPO@/packages/fx-runner/src/vm/installPlan.ts";
          const mem = Number(/MemTotal:\s+(\d+)/.exec(readFileSync(process.env.MEMINFO!, "utf8"))![1]);
          const plan = buildInstallPlan({
            cpus: cpus().length,
            memTotalKb: mem,
            smallestTemplateRamMb: 512,
            runner: { user: process.env.RUNNER_USER!, uid: Number(process.env.RUNNER_UID), gid: Number(process.env.RUNNER_GID) },
            takenUids: [],
            takenGids: [],
          });
          writeFileSync(`${process.env.PLAN_DIR}/config.json`, plan.config.text);
          writeFileSync(`${process.env.PLAN_DIR}/fx-vmhelper.service`, plan.unit.text);
          EOF
          sed -i "s|@REPO@|$GITHUB_WORKSPACE|" "$W/plan/entry.ts"
          pnpm --filter @fulcrumaxe/fx-runner exec esbuild "$W/plan/entry.ts" --bundle --platform=node --format=esm --outfile="$W/plan/entry.mjs"
          MEMINFO=/proc/meminfo RUNNER_USER="$(id -un)" RUNNER_UID="$(id -u)" RUNNER_GID="$(id -g)" PLAN_DIR="$W/plan" node "$W/plan/entry.mjs"
          cat "$W/plan/config.json" "$W/plan/fx-vmhelper.service"
      - name: Install the helper like production and start it
        run: |
          df -h / /mnt | tee -a "$W/host.txt"
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          K="$(sha "$FX_VM_KERNEL")"; R="$(sha "$FX_VM_ROOTFS")"; A="$(sha "$GITHUB_WORKSPACE/infra/microvm-image/guest/agent.py")"
          # The hosted image's /opt is mode 0777, and the helper refuses a binary whose path has a directory anyone can write.
          sudo chmod 0755 /opt
          sudo groupadd --system fx-vmhelper
          sudo usermod -aG fx-vmhelper "$(id -un)"
          O=/opt/fx-vmhelper
          sudo install -d -m 0755 -o root -g root "$O" "$O/bin" "$O/templates" "$O/templates/fx-agent" /etc/fx-vmhelper
          sudo install -d -m 0711 -o root -g root /var/lib/fx-vm
          sudo install -d -m 0700 -o root -g root /var/lib/fx-vm-snapshots
          sudo install -m 0755 -o root -g root "$W/fx-vmhelper" "$O/bin/fx-vmhelper"
          sudo install -m 0755 -o root -g root "$W"/release-v*-x86_64/jailer-v*-x86_64 "$O/bin/jailer"
          sudo install -m 0755 -o root -g root "$FX_VM_FIRECRACKER" "$O/bin/firecracker"
          sudo install -m 0644 -o root -g root "$FX_VM_KERNEL" "$O/templates/fx-agent/kernel"
          sudo install -m 0644 -o root -g root "$FX_VM_ROOTFS" "$O/templates/fx-agent/rootfs"
          printf '{"fx-agent":{"kernel":"%s","rootfs":"%s"}}\n' "$K" "$R" | sudo tee "$O/template-manifest.json" > /dev/null
          sudo chmod 0644 "$O/template-manifest.json"
          sudo install -m 0600 -o root -g root "$W/plan/config.json" /etc/fx-vmhelper/config.json
          # The unit is installed exactly as the installer renders it. It carries no User= line: with `User=root` written out, systemd 255
          # on this image started the helper without CAP_SETUID in its effective set (CapEff 0x08200041, pinned 0x082000c1).
          if grep -q '^User=' "$W/plan/fx-vmhelper.service"; then echo "the rendered unit carries a User= line"; exit 1; fi
          sudo install -m 0644 -o root -g root "$W/plan/fx-vmhelper.service" /etc/systemd/system/fx-vmhelper.service
          # what a dispatched host tells the real-VM suites (see the header of the two test files)
          T="vm-fx-agent-${K:0:12}"
          jq -n --arg k "$K" --arg r "$R" --arg a "$A" --arg t "$T" '{arch:"amd64",digests:{kernel:$k,rootfs:$r,agent:$a},listing:{ok:true,paths:["\($t)/kernel-amd64-\($k)","\($t)/rootfs-amd64-\($r)","\($t)/agent-amd64-\($a)"]}}' > "$W/boot-facts.json"
          {
            echo "FX_VM_HELPER_SOCKET=/run/fx-vmhelper/helper.sock"
            echo "FX_VM_TEMPLATE=fx-agent"
            echo "FX_VM_AGENT=$GITHUB_WORKSPACE/infra/microvm-image/guest/agent.py"
            echo "FX_VM_BOOT_FACTS=$W/boot-facts.json"
          } >> "$GITHUB_ENV"
          sudo systemctl daemon-reload
          sudo systemctl start fx-vmhelper.service || { sudo journalctl -u fx-vmhelper --no-pager | tail -n 60; exit 1; }
          for i in $(seq 1 20); do sudo test -S /run/fx-vmhelper/helper.sock && break; sleep 0.5; done
          sudo systemctl status fx-vmhelper.service --no-pager | head -n 20
          # the proof for the unit text: the running helper's own capability sets (pinned effective set 0x082000c1)
          HPID="$(systemctl show -p MainPID --value fx-vmhelper.service)"
          { echo "helper main pid $HPID"; grep -E '^(CapInh|CapPrm|CapEff|CapBnd|CapAmb|NoNewPrivs|Seccomp):' "/proc/$HPID/status"; } | tee -a "$W/host.txt"
          sudo test -S /run/fx-vmhelper/helper.sock
      # The vmJob.real host search runs as root through `sudo -n`, from a copy that is root-owned and not writable by the test user. It reads the
      # token from standard input, prints only counts and paths, and plants its own control; the token is in no log and no artifact.
      - name: Install the root-on-host token search (vmJob.real calls it through sudo -n)
        run: |
          sudo install -m 0755 -o root -g root packages/fx-runner/test/vm/helpers/hostTokenSearch.sh /usr/local/sbin/fx-host-token-search
          sudo -n true
          echo "FX_VM_HOST_SEARCH=/usr/local/sbin/fx-host-token-search" >> "$GITHUB_ENV"
      - name: Boot the guest under Firecracker and run the probes (the whole vm test directory)
        # sg gives the test process the helper's group (the socket directory is root:fx-vmhelper 0750; a usermod does not reach a running
        # shell). The tests still run as this ordinary user, never as root: the helper-backed suites refuse root.
        run: sg fx-vmhelper -c 'bash -o pipefail -c "pnpm --filter @fulcrumaxe/fx-runner exec vitest run test/vm --reporter=default --reporter=json --outputFile.json=$W/vitest.json 2>&1 | tee $W/vitest.txt"'
      # The helper is installed and started above, so the helper-backed real suites MUST run here. Each of them skips quietly (with a warning)
      # when an env var is missing, and a skipped file reports as passed: this step turns that into a failure. A file with no passed test
      # (skipped, missing from the report, or empty) fails the job, and the message names the variables the file checks.
      - name: The helper-backed real-VM suites ran (a skip is a failure)
        run: |
          cat > "$W/real-suites-ran.mjs" <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          const root = `${process.env.GITHUB_WORKSPACE}/packages/fx-runner/test/vm`;
          const FIRECRACKER = ["FX_VM_FIRECRACKER", "FX_VM_KERNEL", "FX_VM_ROOTFS"];
          const suites = {
            "microvmSandbox.real": ["FX_VM_HELPER_SOCKET", "FX_VM_TEMPLATE", "FX_VM_KERNEL", "FX_VM_ROOTFS", "FX_VM_AGENT"],
            "workspaceCrossing.real": ["FX_VM_HELPER_SOCKET", "FX_VM_TEMPLATE", "FX_VM_BOOT_FACTS"],
            "vmJob.real": ["FX_VM_HELPER_SOCKET", "FX_VM_TEMPLATE", "FX_VM_KERNEL", "FX_VM_ROOTFS", "FX_VM_AGENT"],
            "vmToken.real": FIRECRACKER,
            "vmBoot.real": FIRECRACKER,
            "vmStream.real": FIRECRACKER,
          };
          // Tests of a suite that skip ALONE when a tool or variable is missing; each must pass too (a test is matched by the text its title holds).
          const mustRun = { "vmJob.real": ["26a (engines)", "26a (host)"] };
          const report = JSON.parse(readFileSync(process.env.VITEST_JSON, "utf8"));
          let bad = 0;
          for (const [name, vars] of Object.entries(suites)) {
            const file = `${root}/${name}.test.ts`;
            if (!existsSync(file)) {
              console.log(`::error::${name}: the file is missing from the tree`); bad++; continue;
            }
            const run = report.testResults.find((r) => r.name === file);
            const count = (status) => (run?.assertionResults ?? []).filter((t) => t.status === status).length;
            const passed = count("passed"), skipped = count("skipped") + count("pending") + count("todo"), failed = count("failed");
            console.log(`${name}: ${passed} passed, ${failed} failed, ${skipped} skipped${run === undefined ? " (not in the vitest report)" : ""}`);
            for (const part of passed > 0 ? (mustRun[name] ?? []) : []) {
              const t = (run?.assertionResults ?? []).find((x) => `${x.title} ${x.fullName}`.includes(part));
              if (t?.status === "passed") continue;
              bad++;
              console.log(`::error::${name}: the test "${part}" did not pass (${t === undefined ? "not in the report" : t.status}); it skips alone when a tool or variable is missing here (FX_VM_HOST_SEARCH=${process.env.FX_VM_HOST_SEARCH ?? "unset"}; the bubblewrap probe is in host.txt)`);
            }
            if (passed > 0) continue;
            bad++;
            const unset = vars.filter((v) => !process.env[v]);
            console.log(`::error::${name} ran no test: ${run === undefined ? "it is not in the report" : `${skipped} skipped`}. It checks ${vars.join(", ") || "(see the file header)"}; unset here: ${unset.join(", ") || "none (the file skipped for another reason, for instance running as root)"}`);
          }
          if (bad > 0) { console.log(`${bad} helper-backed real suite(s) did not run, and the helper is installed in this job, so this is a failure`); process.exit(1); }
          EOF
          VITEST_JSON="$W/vitest.json" node "$W/real-suites-ran.mjs"
      - name: The helper's log and state (no secrets, it logs events only)
        if: always()
        run: |
          sudo systemctl status fx-vmhelper.service --no-pager > "$W/helper-status.txt" 2>&1 || true
          sudo journalctl -u fx-vmhelper --no-pager > "$W/helper.log" 2>&1 || true
          sudo dmesg 2>/dev/null | tail -n 60 > "$W/dmesg.txt" || true
          tail -n 80 "$W/helper.log" || true
      - name: Job summary
        if: always()
        run: |
          {
            echo "## microVM image and Firecracker probe"
            echo
            echo "Host (hosted runner, nested):"
            echo '```'
            cat "$W/host.txt" 2>/dev/null || echo "not reached"
            echo '```'
            echo "Root disks (amd64 and arm64), built from one image digest with $(cat "$W/mke2fs.txt" 2>/dev/null):"
            echo '```'
            cat "$W/report-a.txt" 2>/dev/null || echo "not built"
            echo '```'
            echo "Second build: $(diff <(grep '^rootfs' "$W/report-a.txt") <(grep '^rootfs' "$W/report-b.txt") > /dev/null 2>&1 && echo identical || echo "different, or not run")"
            echo
            echo "Boot and probes (hosted-nested; the time is information only):"
            echo '```'
            grep -E 'first agent answer|Test Files|Tests |FAIL|✓|×|Error' "$W/vitest.txt" 2>/dev/null || echo "not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microvm-image-reports
          path: |
            /mnt/fxvm/host.txt
            /mnt/fxvm/mke2fs.txt
            /mnt/fxvm/report-a.txt
            /mnt/fxvm/report-b.txt
            /mnt/fxvm/vitest.txt
            /mnt/fxvm/vitest.json
            /mnt/fxvm/helper.log
            /mnt/fxvm/helper-status.txt
            /mnt/fxvm/dmesg.txt
            /mnt/fxvm/a/build.json
          if-no-files-found: warn
      - name: Stop the helper
        if: always()
        run: sudo systemctl stop fx-vmhelper.service || true
      - name: Remove the registry
        if: always()
        run: docker rm -f fx-registry || true
